default_language_version:
  python: python3.11

# Fixed third-party editor plugins are versioned as vendor code and reviewed at
# upgrade time; repository checks cover JIGCAT-owned files only.
exclude: ^addons/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: 4.5.0
    hooks:
      - id: gdformat
        files: ^(scripts|test)/.+\.gd$
      - id: gdlint
        files: ^(scripts|test)/.+\.gd$
