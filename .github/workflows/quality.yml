name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.8"
          enable-cache: true
      - name: Restore pre-commit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py311-${{ hashFiles('uv.lock', '.pre-commit-config.yaml', 'gdlintrc') }}
      - name: Synchronize locked tools
        run: uv sync --locked --group dev
      - name: Show tool versions
        run: |
          python --version
          uv --version
          uv run pre-commit --version
          uv run gdformat --version
          uv run gdlint --version
      - name: Run repository checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  gdunit:
    name: gdunit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Godot 4.6.2
        env:
          GODOT_SHA256: 30e6b6d141f0cd5bebd629ad1d0ef1324e60091bb20662d026b402ba58c59937
          GODOT_VERSION: 4.6.2
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          echo "${GODOT_SHA256}  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Scan project classes
        run: |
          mkdir -p .artifacts/ci/gdunit
          godot --headless --editor --quit --path . 2>&1 | tee .artifacts/ci/gdunit/editor.log
      - name: Run unit tests
        run: |
          mkdir -p .artifacts/ci/gdunit
          GODOT_BIN=godot GDUNIT_LOG_FILE=.artifacts/ci/gdunit/godot.log \
            xvfb-run -a ./tools/run_gdunit4.sh -a ./test/unit 2>&1 | tee .artifacts/ci/gdunit/gdunit.out
      - name: Upload GdUnit diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gdunit-${{ github.run_id }}
          path: |
            .artifacts/ci/gdunit/
            reports/
          retention-days: 14
          if-no-files-found: warn

  runtime-validation:
    name: runtime-validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Godot 4.6.2
        env:
          GODOT_SHA256: 30e6b6d141f0cd5bebd629ad1d0ef1324e60091bb20662d026b402ba58c59937
          GODOT_VERSION: 4.6.2
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          echo "${GODOT_SHA256}  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Run runtime validation
        run: GODOT_BIN=godot CI_ARTIFACT_DIR=.artifacts/ci/runtime-validation ./tools/run_runtime_validation.sh
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-validation-${{ github.run_id }}
          path: .artifacts/ci/runtime-validation/
          retention-days: 14
          if-no-files-found: warn
