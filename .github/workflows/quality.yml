name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: pipx install pre-commit==4.6.0
      - name: Run repository checks
        run: pre-commit run --all-files --show-diff-on-failure

  gdunit:
    name: GdUnit4
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Godot 4.6.2
        env:
          GODOT_VERSION: 4.6.2
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Scan project classes
        run: godot --headless --editor --quit --path .
      - name: Run unit tests
        run: GODOT_BIN=godot xvfb-run -a ./tools/run_gdunit4.sh -a ./test/unit
