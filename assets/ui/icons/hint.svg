<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>Hint</title>
  <!--
    Bulb with cat ears, single colour. Geometry fitted to the reference icon
    sheet; the ear tips are rounded with a quadratic through the apex.
    Authored on a 169x235 grid, scaled and centred in a 240x240 box.
  -->
  <g transform="translate(42.5 12) scale(0.919)"
     fill="none" stroke="#0B4750" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- glass: shoulder, around the bulb, into the neck -->
    <path d="M 22.5,42.5 A 75,75 0 0 0 25,139.5 C 36,148 50,158 50,178.5"/>
    <path d="M 145.5,42.5 A 75,75 0 0 1 143,139.5 C 132,148 118,158 118,178.5"/>
    <!-- ears: straight outer leg, rounded tip, straight inner leg to the notch -->
    <path d="M 22.5,42.5 L 22.9,10.1 Q 29,-2 35.2,10 L 51.5,27"/>
    <path d="M 145.5,42.5 L 145.1,10.1 Q 139,-2 132.8,10 L 116.5,27"/>
    <!-- crown between the ears -->
    <path d="M 51.5,27 Q 84,9.5 116.5,27"/>
    <!-- screw base -->
    <rect x="45.5" y="184.5" width="77" height="20" rx="8.5"/>
    <rect x="51" y="211.5" width="65" height="17.5" rx="6.5"/>
  </g>
</svg>
